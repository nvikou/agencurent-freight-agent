services:
  backend:
    build: ./backend
    container_name: agencurent-backend
    environment:
      DATABASE_PATH: /app/data/database.db
      REPORTS_DIR: /app/reports
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: agencurent-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
